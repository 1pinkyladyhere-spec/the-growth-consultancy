<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Growth Consultancy</title>
</head>
<body>
  <script>
    fetch('./ELLE_NEW_WEBSITE_LULU_READY.html')
      .then(function(response) {
        if (!response.ok) throw new Error('Website file could not be loaded.');
        return response.text();
      })
      .then(function(html) {
        var heroStart = html.indexOf('<section class="hero">');
        var heroEnd = heroStart >= 0 ? html.indexOf('</section>', heroStart) : -1;

        if (heroEnd >= 0) {
          heroEnd += '</section>'.length;
          var startingPointDoorway = `
<section aria-label="Starting Point" style="background:var(--paper,#fffaf1);border-top:1px solid rgba(199,154,69,.42);border-bottom:1px solid rgba(199,154,69,.42);padding:32px 20px;text-align:center;">
  <div style="width:min(900px,100%);margin:0 auto;">
    <p style="margin:0 0 7px;font-family:var(--sans,Arial,sans-serif);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold,#c79a45);">Not a business owner?</p>
    <a href="starting-point.html" style="display:inline-block;font-family:var(--serif,Georgia,serif);font-size:clamp(1.35rem,2.4vw,1.8rem);line-height:1.25;color:var(--ink,#10261f);text-decoration:none;border-bottom:1px solid var(--gold,#c79a45);padding-bottom:2px;">Start here → Starting Point</a>
    <p style="margin:10px auto 0;max-width:650px;font-family:var(--sans,Arial,sans-serif);font-size:.92rem;line-height:1.55;color:var(--muted,#65716b);">You don’t have to know what comes next. Starting Point is a place to explore what else could be possible for your life.</p>
  </div>
</section>`;
          html = html.slice(0, heroEnd) + startingPointDoorway + html.slice(heroEnd);
        }

        var currentConsultantParagraph = `<p>When I look at a business, I want to understand it before I make recommendations about it. I want to know how it became what it is today, why certain decisions were made, what you value about what you've built and what you want it to make possible from here.</p>`;
        var approvedConsultantParagraph = `<p>Every business has a history. I want to know yours. I want to know how it became what it is today, why certain decisions were made, what you value about what you've built and what you want it to make possible from here.</p>`;
        html = html.replace(currentConsultantParagraph, approvedConsultantParagraph);

        var currentReadyParagraph = `<p>If you're considering working with me, I highly recommend completing both before scheduling your first session. You'll come into our conversation already thinking about some of the questions we'll need to explore, which means we can spend more of our time together focused on where you want to go and what your business needs to get you there.</p>`;
        var approvedReadyParagraph = `<p>If you're considering working with me, I highly recommend completing both before reaching out. You'll come into our conversation already thinking about some of the questions we'll need to explore, which allows us to begin with a deeper understanding of where you are and where you'd like to go.</p>`;
        html = html.replace(currentReadyParagraph, approvedReadyParagraph);

        var booksSection = `<section class="section" id="books-resources">`;
        var approvedAdditions = `
<section class="section paper" aria-label="Diagnostic Assessment">
  <div class="container">
    <div class="copy-stack reveal">
      <h2>I Don't Start With Answers. I Start By Understanding.</h2>
      <p>If, after our initial conversation, we decide it makes sense to work together, the first paid step is a <strong>Diagnostic Assessment</strong>.</p>
      <p>This is where I get into the business itself.</p>
      <p>I'll ask you to share information about your business and answer a series of questions in your own words. Then I take the time to evaluate what you've shared, look at how the business is operating, and consider what may be standing between where you are and where you want to go.</p>
      <p>From there, I develop my assessment and recommendations.</p>
      <p>Then we'll schedule a call to go through what I've found, what I believe deserves your attention, and what I recommend you consider next.</p>
      <p>You may decide to take those recommendations and move forward on your own. Or we may identify additional work you'd like my help with. If we both decide to continue, we'll determine the scope of that work separately.</p>
      <p><strong>Because I don't believe in giving you answers before I've taken the time to understand the questions.</strong></p>
    </div>
  </div>
</section>

<section class="section dark" aria-label="Growth Consultancy inquiry">
  <div class="container">
    <div class="copy-stack reveal">
      <h2>What Could Change If You Started Now?</h2>
      <p>Six months from now, your business could look different.<br>Your days could look different.<br>The way you feel about what you've built could be different.</p>
      <p>But at some point, thinking about what needs to change has to become a decision to begin.</p>
      <p><strong>Maybe this is that moment.</strong></p>
      <p>If you're ready to find out what could be possible for you and your business, I'd love to hear from you.</p>
      <p><strong>Send me an email. Tell me a little about where things are now and where you'd like to go.</strong></p>
      <p>I'll personally read it, and if I believe I may be able to help, we'll schedule a conversation.</p>
      <div class="btn-row"><a class="btn gold" href="mailto:elle@thegrowthconsultancybyelle.com?subject=Growth%20Consultancy%20Inquiry">Email Elle →</a></div>
    </div>
  </div>
</section>

`;
        html = html.replace(booksSection, approvedAdditions + booksSection);

        document.open();
        document.write(html);
        document.close();
      })
      .catch(function() {
        document.body.innerHTML = '<p style="font-family:Arial,sans-serif;padding:40px">The Growth Consultancy website is temporarily unavailable.</p>';
      });
  </script>
</body>
</html>
